name: Release

on:
  workflow_dispatch:
    inputs:
      release_version:
        description: "Release version, e.g. 0.1.0 or 0.2.0-rc.1 (no v prefix)"
        required: true
        type: string
  pull_request:

concurrency:
  # Serialize publishing across branches, while superseding stale PR checks.
  group: ${{ github.event_name == 'workflow_dispatch' && format('release-{0}', github.repository) || format('release-validate-{0}-{1}', github.repository, github.ref) }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

# Do not add permissions here. Configure them at the job level.
permissions: {}

jobs:
  build-bundle:
    name: Validate and prepare release
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      release_version: ${{ steps.validate.outputs.release_version }}
      is_prerelease: ${{ steps.validate.outputs.is_prerelease }}
      test_matrix: ${{ steps.bundles.outputs.test_matrix }}
      bundle_filename: ${{ fromJson(steps.bundles.outputs.release_bundles)[0].artifact_file }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-roc

      - name: Require a branch for release follow-up PRs
        if: github.event_name == 'workflow_dispatch'
        run: test "$GITHUB_REF_TYPE" = branch

      - name: Validate release request
        id: validate
        uses: roc-lang/release-package/actions/validate-release@af2f0cd8662874b825ff3917f4286e793ba18c55
        with:
          release_version: ${{ github.event_name == 'workflow_dispatch' && inputs.release_version || '' }}
          dry_run: ${{ github.event_name != 'workflow_dispatch' }}
          github_token: ${{ github.token }}

      - name: Run checks
        run: scripts/all_tests.sh

      - name: Resolve previous stable release
        id: previous
        if: github.event_name == 'workflow_dispatch'
        uses: roc-lang/release-package/actions/resolve-previous-release@af2f0cd8662874b825ff3917f4286e793ba18c55
        with:
          github_token: ${{ github.token }}

      - name: Check API version bump
        uses: roc-lang/release-package/actions/run-bump-check@af2f0cd8662874b825ff3917f4286e793ba18c55
        with:
          release_version: ${{ steps.validate.outputs.release_version }}
          dry_run: ${{ steps.validate.outputs.is_dry_run }}
          # A first release has no baseline. Once one exists, failures block publication.
          bump_check: ${{ steps.previous.outputs.previous_url != '' && 'require' || 'warn' }}
          bump_entrypoint: src/main.roc
          previous_url: ${{ steps.previous.outputs.previous_url }}

      - name: Bundle package
        run: scripts/bundle.sh

      - name: Prepare bundle metadata and test matrix
        id: bundles
        uses: roc-lang/release-package/actions/prepare-bundles@af2f0cd8662874b825ff3917f4286e793ba18c55
        with:
          bundle_glob: dist/*.tar.zst
          test_os_json: '["ubuntu-26.04","ubuntu-26.04-arm","macos-26","macos-26-intel","windows-2025"]'

      - name: Check there is one release bundle
        run: jq -e 'length == 1' .release/release-bundles.json

      - uses: actions/upload-artifact@v7
        with:
          name: release-bundles
          path: .release/bundles/*.tar.zst
          retention-days: 30
          if-no-files-found: error

      - uses: actions/upload-artifact@v7
        with:
          name: release-metadata
          path: |
            .release/release-bundles.json
            .release/test-matrix.json
            .release/bump-output.txt
          retention-days: 30
          if-no-files-found: error

      - name: Archive the documentation built during checks
        run: tar -czf dist/package-docs.tar.gz -C generated-docs .

      - uses: actions/upload-artifact@v7
        with:
          name: release-docs
          path: dist/package-docs.tar.gz
          retention-days: 30
          if-no-files-found: error

  test-bundle:
    name: Test package bundle (${{ matrix.os }})
    needs: build-bundle
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.build-bundle.outputs.test_matrix) }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-roc
      - uses: actions/download-artifact@v8
        with:
          name: release-bundles
          path: .release/test-bundles
      - name: Test the downloaded package
        uses: roc-lang/release-package/actions/test-bundle@af2f0cd8662874b825ff3917f4286e793ba18c55
        with:
          # The bundle path is appended as the last argument.
          test_bundle_command: scripts/test_bundle.sh
          bundle_path: .release/test-bundles/${{ matrix.artifact_file }}
          bundle_name: ${{ matrix.bundle_name }}
          release_version: ${{ needs.build-bundle.outputs.release_version }}

  create-release:
    name: Publish GitHub release
    needs: [build-bundle, test-bundle]
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: write
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: release-bundles
          path: .release/bundles
      - uses: actions/download-artifact@v8
        with:
          name: release-metadata
          path: .release
      - uses: actions/download-artifact@v8
        with:
          name: release-docs
          path: dist

      - name: Generate release notes
        uses: roc-lang/release-package/actions/make-release-notes@af2f0cd8662874b825ff3917f4286e793ba18c55
        with:
          release_version: ${{ needs.build-bundle.outputs.release_version }}
          github_token: ${{ github.token }}

      - name: Add package import instructions
        env:
          RELEASE_VERSION: ${{ needs.build-bundle.outputs.release_version }}
          BUNDLE_FILENAME: ${{ needs.build-bundle.outputs.bundle_filename }}
        run: |
          roc_version="$(tr -d '\r\n' < .roc-version)"
          bundle_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/download/$RELEASE_VERSION/$BUNDLE_FILENAME"
          printf '\nBuilt with Roc %s.\n\nImport this package:\n\n```roc\npkg: "%s"\n```\n\n`package-docs.tar.gz` contains the documentation generated from this release commit.\n' \
            "$roc_version" "$bundle_url" >> .release/release-notes.md

      - name: Publish release and documentation archive
        uses: roc-lang/release-package/actions/publish-release@af2f0cd8662874b825ff3917f4286e793ba18c55
        with:
          release_version: ${{ needs.build-bundle.outputs.release_version }}
          additional_assets: dist/package-docs.tar.gz
          target: ${{ github.sha }}
          github_token: ${{ github.token }}

  publish-docs:
    name: Publish stable release documentation
    needs: [build-bundle, create-release]
    if: github.event_name == 'workflow_dispatch' && needs.build-bundle.outputs.is_prerelease == 'false'
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/generate-docs.yaml
    with:
      release-tag: ${{ needs.build-bundle.outputs.release_version }}

  test-published:
    name: Test published bundle (${{ matrix.os }})
    needs: [build-bundle, create-release]
    if: github.event_name == 'workflow_dispatch'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.build-bundle.outputs.test_matrix) }}
    defaults:
      run:
        shell: bash
    env:
      BUNDLE_URL: ${{ github.server_url }}/${{ github.repository }}/releases/download/${{ needs.build-bundle.outputs.release_version }}/${{ needs.build-bundle.outputs.bundle_filename }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-roc
      - run: scripts/test_bundle.sh "$BUNDLE_URL"

  readme-pull-request:
    name: Propose the tested README URL
    needs: [build-bundle, test-published]
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - name: Put the release URL in README.md
        env:
          BUNDLE_URL: ${{ github.server_url }}/${{ github.repository }}/releases/download/${{ needs.build-bundle.outputs.release_version }}/${{ needs.build-bundle.outputs.bundle_filename }}
        run: |
          set -euo pipefail
          prefix="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/download/"
          PREFIX="$prefix" perl -pi -e 's|\Q$ENV{PREFIX}\E[^"]+\.tar\.zst|$ENV{BUNDLE_URL}|g' README.md
          grep -qF "$BUNDLE_URL" README.md
      - name: Open or update the README PR
        uses: roc-lang/release-package/actions/create-followup-pr@af2f0cd8662874b825ff3917f4286e793ba18c55
        with:
          release_version: ${{ needs.build-bundle.outputs.release_version }}
          paths: README.md
          branch_prefix: release-readme
          base_branch: ${{ github.ref_name }}
          commit_message: Point README.md at ${{ needs.build-bundle.outputs.release_version }}
          pr_title: Point README.md at ${{ needs.build-bundle.outputs.release_version }}
          pr_body: |
            Puts the published ${{ needs.build-bundle.outputs.release_version }} bundle URL in README.md.

            The examples passed against that URL on all five runners.
            See [validation](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}).

            GITHUB_TOKEN does not trigger normal PR workflows; validation ran explicitly before this PR was opened.
          github_token: ${{ github.token }}
