name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      roc-nightly:
        description: Test a candidate compiler without changing the repository pin
        required: false
        type: string
        default: ""

# Do not add permissions here. Configure them at the job level.
permissions: {}

# Cancel a run when a newer commit on the same ref starts one.
concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bundle:
    name: Bundle the package
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-roc
        with:
          nightly-tag: ${{ inputs.roc-nightly || '' }}
      - run: scripts/bundle.sh
      - uses: actions/upload-artifact@v7
        with:
          name: bundle
          path: dist
          if-no-files-found: error
          retention-days: 7

  test:
    name: Test (${{ matrix.os }})
    needs: bundle
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-26.04, ubuntu-26.04-arm, macos-26, macos-26-intel, windows-2025]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-roc
        with:
          nightly-tag: ${{ inputs.roc-nightly || '' }}
      - name: Check, test, run the examples and generate docs
        run: scripts/all_tests.sh
      # Bundle once on Linux and test those exact bytes on every runner.
      - uses: actions/download-artifact@v8
        with:
          name: bundle
          path: dist
      - name: Run the examples against the bundle
        run: scripts/test_bundle.sh
