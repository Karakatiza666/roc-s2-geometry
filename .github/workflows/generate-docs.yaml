name: Deploy release docs

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release-tag:
        description: Release tag to deploy (empty uses the latest release)
        required: false
        type: string
  workflow_call:
    inputs:
      release-tag:
        description: Release whose documentation asset should be deployed
        required: true
        type: string

# Do not add permissions here. Configure them at the job level.
permissions: {}

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  generate-docs:
    # Prereleases keep their archive but do not replace the stable site automatically.
    if: github.event_name != 'release' || !github.event.release.prerelease
    name: Deploy archived release documentation
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/configure-pages@v6
      # Redeploy the docs of the release commit, without needing its compiler.
      - name: Download release documentation
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release-tag || github.event.release.tag_name }}
        run: |
          set -euo pipefail
          mkdir -p dist generated-docs
          args=()
          if [[ -n "$RELEASE_TAG" ]]; then args+=("$RELEASE_TAG"); fi
          gh release download "${args[@]}" --pattern package-docs.tar.gz --dir dist
          tar -xzf dist/package-docs.tar.gz -C generated-docs
          test -f generated-docs/index.html
      - uses: actions/upload-pages-artifact@v5
        with:
          path: generated-docs
      - name: Deploy docs
        id: deploy
        uses: actions/deploy-pages@v5
